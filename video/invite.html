<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Invite Video</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Lora:ital,wght@0,400;0,700;1,400;1,600&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
<style>
  :root{--royal:#3A161B;--royal-2:#55212A;--love:#7E2A33;--cream:#FAF5EE;--paper:#FFFDF8;--ink:#4A342E;--soft:#7A635B;--terra:#B4664A;--terra-dark:#9A5138;--gold:#C19A5B;
    --serif:'Cormorant Garamond',Georgia,serif;--body:'Lora',Georgia,serif;--deva:'Tiro Devanagari Hindi',serif}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1920px;overflow:hidden;background:var(--royal)}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(ellipse at top,var(--royal-2),var(--royal) 70%);color:var(--ink);font-family:var(--body);font-variant-numeric:lining-nums;text-align:center}
  .rod{position:absolute;z-index:3;left:6px;right:6px;height:56px;border-radius:28px;background:linear-gradient(180deg,#7A5A2A 0%,#E9D29A 30%,#C19A5B 55%,#8A6A35 85%,#5E4420 100%);box-shadow:0 12px 24px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.35)}
  .rod::before,.rod::after{content:"";position:absolute;top:-12px;width:42px;height:80px;border-radius:21px;background:radial-gradient(circle at 40% 35%,#F3E1AE,#C19A5B 45%,#6E5026 100%);box-shadow:0 6px 12px rgba(0,0,0,.45)}
  .rod::before{left:0}.rod::after{right:0}
  .rod.top{top:14px}.rod.bottom{bottom:14px}
  #paper{position:absolute;left:34px;right:34px;top:42px;bottom:42px;background:var(--cream);box-shadow:0 0 80px rgba(0,0,0,.45);overflow:hidden}
  #paper::after{content:"";position:absolute;z-index:2;inset:28px 0;border:150px solid transparent;border-image:url("../static/images/frame-royal.svg") 120 round;pointer-events:none}
  .petal{position:absolute;z-index:0;width:26px;height:38px;border-radius:50% 50% 50% 50%/70% 70% 30% 30%}
  .scene{position:absolute;z-index:1;inset:100px 110px;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0}
  .a{display:block}

  .eyebrow{text-transform:uppercase;letter-spacing:.26em;font-size:32px;color:var(--terra);margin-bottom:26px}
  .divider{color:var(--gold);font-size:46px;margin:30px 0}
  .ganesh{width:440px;height:auto}
  .shloka{font-family:var(--deva);color:var(--terra-dark);-webkit-text-stroke:.9px currentColor;font-size:50px;line-height:1.7;margin-top:56px}
  .monogram{width:430px;height:auto;margin-bottom:34px}
  .names{font-family:var(--serif);font-weight:500;font-size:140px;line-height:1.1;white-space:nowrap}
  .love{color:var(--love);font-size:.86em}
  .hindi{font-family:var(--deva);font-size:56px;color:var(--soft);margin-top:12px}
  .date{font-family:var(--serif);font-weight:700;font-size:82px;line-height:1.15}
  .place{font-size:42px;color:var(--soft);margin-top:14px}

  .elders{font-style:italic;font-weight:600;font-size:39px;line-height:1.45;color:var(--soft)}
  .parents{font-family:var(--serif);font-weight:700;font-size:62px;line-height:1.25;margin-top:16px}
  .join{font-family:var(--serif);font-size:78px;color:var(--terra);margin:36px 0;font-style:italic}
  .lead{font-size:42px;color:var(--soft);margin-bottom:44px}
  i.nb{font-style:inherit;white-space:nowrap}

  .day{font-family:var(--serif);font-weight:700;font-size:64px;white-space:nowrap;line-height:1.15;color:var(--terra-dark);margin-bottom:48px}
  .card{width:100%;background:var(--paper);border:2px solid rgba(193,154,91,.6);border-radius:30px;padding:46px 30px;box-shadow:0 12px 40px rgba(74,52,46,.08)}
  .card + .card{margin-top:34px}
  .time{font-weight:700;font-size:44px;letter-spacing:.14em;color:var(--terra-dark);text-transform:uppercase}
  .event{font-family:var(--serif);font-weight:500;font-size:74px;line-height:1.14;margin-top:14px}
  .where{font-size:38px;color:var(--soft);margin-top:16px}

  .venue{font-family:var(--serif);font-weight:700;font-size:118px;line-height:1.1}
  .route{width:100%;margin-top:34px;background:var(--paper);border:2px solid rgba(193,154,91,.6);border-radius:30px;padding:34px 26px}
  .route small{display:block;font-size:30px;letter-spacing:.2em;text-transform:uppercase;color:var(--terra)}
  .route strong{display:block;font-family:var(--serif);font-weight:700;font-size:54px;line-height:1.2;margin-top:10px}

  .link-label{font-size:38px;color:var(--soft);margin-top:56px}
  .link{font-weight:700;font-size:39px;color:var(--terra-dark);margin-top:16px;white-space:nowrap}
  .hashtag{font-family:var(--serif);font-size:58px;color:var(--terra);margin-top:48px}
</style>
</head>
<body>
<div id="stage">
  <div class="rod top"></div><div class="rod bottom"></div>
  <div id="paper"></div>
</div>
<!-- generated from data/story.yaml by render.mjs -->
<script src=".cache/story.js"></script>
<script>
(() => {
const S = window.STORY, LINK = window.INVITE_LINK;
const paper = document.getElementById('paper');

// h('tag.class', text-or-children, delay): .a elements fade up after `delay` seconds into their scene
function h(spec, content, delay) {
  const [tag, ...cls] = spec.split('.');
  const e = document.createElement(tag || 'div');
  if (cls.length) e.className = cls.join(' ');
  if (delay !== undefined) { e.classList.add('a'); e.dataset.d = delay; }
  [].concat(content ?? []).forEach(c => e.append(c));
  return e;
}
function img(src, cls, delay) {
  const e = h('img.' + cls, null, delay);
  e.src = src;
  return e;
}
// names may only wrap at the "&", never inside a person's name
function names(spec, str, delay) {
  const parts = [];
  str.split(' & ').forEach((p, i) => { if (i) parts.push(' & '); parts.push(h('i.nb', p)); });
  return h(spec, parts, delay);
}
function withHeart(spec, str, delay) {
  const [a, b] = str.split('❤');
  return h(spec, [a, h('span.love', '❤︎'), b], delay);
}

const shloka = (S.couple.shloka || 'वक्रतुण्ड महाकाय सूर्यकोटि समप्रभ।\nनिर्विघ्नं कुरु मे देव सर्वकार्येषु सर्वदा॥').split(/\n|<br>/);
const eventCard = (ev, d) => h('.card', [h('p.time', ev.time), h('p.event', ev.name), h('p.where', ev.venue)], d);
const days = Object.values(S.events);
const F = S.families, T = S.travel;

// [seconds on screen, content]
const SCENES = [
  [5, [
    img('../static/images/ganesh.svg', 'ganesh', -1),
    h('p.shloka', shloka.flatMap((l, i) => (i ? [h('br'), l] : [l])), .5),
  ]],
  [7.5, [
    h('p.eyebrow', 'The Wedding Of', .2),
    img('../static/images/hero-placeholder.svg', 'monogram', .4),
    withHeart('p.names', S.couple.display, .8),
    withHeart('p.hindi', S.couple.hindi, 1.1),
    h('p.divider', '❦', 1.4),
    h('p.date', S.wedding.datesLine, 1.6),
    h('p.place', S.wedding.city, 1.9),
  ]],
  [10, [
    h('p.eyebrow', 'Together With Their Families', .2),
    names('p.elders', F.groom_elders, .6),
    names('p.parents', F.groom, 1.1),
    h('p.join', '&', 2),
    names('p.elders', F.bride_elders, 2.4),
    names('p.parents', F.bride, 2.9),
  ]],
  ...days.map(day => [day.items.length > 1 ? 7.5 : 6, [
    h('p.eyebrow', 'The Celebrations', .1),
    h('p.day', day.label, .3),
    ...day.items.map((ev, i) => eventCard(ev, .7 + i * .8)),
  ]]),
  [7, [
    h('p.eyebrow', 'Getting There', .2),
    h('p.venue', T.venue_name, .4),
    h('p.place', T.venue_city, .8),
    h('p.divider', '❦', 1.1),
    h('.route', [h('small', 'By Train'), h('strong', T.station_name)], 1.4),
    h('.route', [h('small', 'By Air'), h('strong', T.airport_name)], 2),
    ...(T.help && T.help.phone ? [h('.route', [h('small', 'Need Help?'), h('strong', [T.help.name, T.help.phone].filter(Boolean).join(' · '))], 2.6)] : []),
  ]],
  [7.5, [
    withHeart('p.names', S.couple.display, .2),
    h('p.divider', '❦', .5),
    h('p.date', 'See you there.', .7),
    h('p.link-label', 'Full invitation, directions & blessings', 1.4),
    h('p.link', LINK, 1.7),
    h('p.hashtag', S.couple.hashtag, 2.2),
  ]],
];

let at = 0;
const scenes = SCENES.map(([dur, kids]) => {
  const el = h('.scene', kids);
  paper.append(el);
  const s = { el, start: at, end: at + dur, parts: [...el.querySelectorAll('.a')].map(e => ({ e, d: Number(e.dataset.d) })) };
  at += dur;
  return s;
});
const DURATION = at, FADE = .6;

// drifting petals: same positions every render, so a frame always looks the same at a given time
const COLORS = ['#D9B36C', '#B4664A', '#E9C987', '#C19A5B'];
const petals = Array.from({ length: 16 }, (_, i) => {
  const r = n => { const x = Math.sin((i + 1) * 12.9898 * n) * 43758.5453; return x - Math.floor(x); };
  const e = h('.petal');
  e.style.background = COLORS[i % COLORS.length];
  paper.append(e);
  return { e, x: r(1) * 1012, phase: r(2), speed: .55 + r(3) * .45, sway: 16 + r(4) * 30, spin: 20 + r(5) * 50 };
});

const ease = p => { p = Math.min(1, Math.max(0, p)); return p * p * (3 - 2 * p); };
function draw(t) {
  const last = scenes.length - 1;
  scenes.forEach((s, i) => {
    const on = i === 0 ? 1 : ease((t - s.start) / FADE);
    const off = i === last ? 0 : ease((t - (s.end - FADE)) / FADE);
    const alpha = on * (1 - off);
    s.el.style.opacity = alpha;
    s.el.style.visibility = alpha > 0 ? 'visible' : 'hidden';
    if (alpha > 0) s.parts.forEach(({ e, d }) => {
      const p = ease((t - s.start - d) / .8);
      e.style.opacity = p;
      e.style.transform = `translateY(${(1 - p) * 26}px)`;
    });
  });
  petals.forEach(p => {
    const y = ((t / 30 * p.speed + p.phase) % 1) * 1980 - 80;
    // keep petals out of the text area in the middle of the page
    p.e.style.opacity = .3 * Math.max(1 - ease((y - 330) / 90), ease((y - 1480) / 90));
    p.e.style.transform = `translate(${p.x + Math.sin(t * .7 + p.phase * 6) * p.sway}px,${y}px) rotate(${t * p.spin + p.phase * 360}deg)`;
  });
}

window.INVITE = { draw, DURATION, keyframes: scenes.map(s => s.end - FADE - .05) };

// live preview in a browser unless driven by render.mjs
if (!location.search.includes('render')) {
  document.fonts.ready.then(() => {
    const t0 = performance.now();
    const loop = now => { draw(((now - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  });
} else draw(0);
})();
</script>
</body>
</html>
